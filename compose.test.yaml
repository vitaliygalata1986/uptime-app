# Изолированная БД для тестов. Запускать отдельным Compose-проектом, см. backend/README.md.
services:
  test-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: uptime_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: uptime_test
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime_test -d uptime_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ./backend
      target: development
    environment:
      TEST_DATABASE_URL: postgres://uptime_test:test_only_password@test-db:5432/uptime_test?sslmode=disable
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "go build -o /tmp/api ./cmd/api && go vet ./... && go test -race -count=1 -v ./..."]
